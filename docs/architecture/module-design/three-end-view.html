<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EyeX · 感知、行为与编排主图</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#263b49;font:15px/1.5 "Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 22px;background:#fff;border-bottom:1px solid #d6dfe4}header strong{font-size:18px;margin-right:auto}a{color:#306b88;text-decoration:none}button,a.action{font:inherit;border:1px solid #bdccd5;background:#fff;border-radius:5px;padding:5px 12px;cursor:pointer;color:#35566a}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 22px;background:#f8fafb;border-bottom:1px solid #d6dfe4}.toolbar span{margin-right:auto;color:#687d89}#viewport{height:calc(100vh - 113px);overflow:auto;padding:18px;scrollbar-gutter:stable;background:#e9eef2}#chart{display:block;max-width:none;height:auto;background:#fff;box-shadow:0 2px 18px #20344018;margin:auto}body.full #viewport{height:100vh}body.full header,body.full .toolbar{display:none}#return{display:none;position:fixed;right:15px;top:12px;z-index:9}body.full #return{display:block}@media(max-width:700px){header{padding:10px 12px}header strong{width:100%}.toolbar{padding:8px 12px}.toolbar span{display:none}#viewport{height:calc(100vh - 145px);padding:8px}}@media print{header,.toolbar,#return{display:none!important}#viewport{height:auto;overflow:visible;padding:0}#chart{width:100%!important;box-shadow:none}@page{size:A3 landscape;margin:8mm}}</style></head><body><header><strong>EyeX · 感知、行为与编排主图</strong><a href="behavior-overview.md">本版设计说明 ↗</a><a href="index.html">关系说明 ↗</a><a class="action" href="diagrams/behavior-overview.svg" download="EyeX-三端架构.svg">下载 SVG</a><a class="action" href="diagrams/behavior-overview.png" download="EyeX-三端架构.png">下载 PNG</a></header><div class="toolbar"><span>感知层 → 编排层 → 共用行为 → 结果反馈</span><button id="fit">适合窗口</button><button id="width">适合宽度</button><button id="native">100%</button><button id="minus">−</button><output id="scale">100%</output><button id="plus">＋</button><button id="full">全屏阅读</button></div><button id="return">退出全屏</button><div id="viewport"><img id="chart" src="diagrams/behavior-overview.svg" alt="EyeX 智能眼镜 Agent 分层架构，右侧含眼镜外观图"></div><script>const v=document.querySelector('#viewport'),im=document.querySelector('#chart'),label=document.querySelector('#scale');let s=1;function zoom(n){s=Math.max(.15,Math.min(3,n));im.style.width=(2700*s)+'px';label.value=Math.round(s*100)+'%'}function fit(){zoom(Math.min((v.clientWidth-36)/2700,(v.clientHeight-36)/1550))}document.querySelector('#fit').onclick=fit;document.querySelector('#width').onclick=()=>zoom((v.clientWidth-36)/2700);document.querySelector('#native').onclick=()=>zoom(1);document.querySelector('#minus').onclick=()=>zoom(s/1.2);document.querySelector('#plus').onclick=()=>zoom(s*1.2);document.querySelector('#full').onclick=()=>{document.body.classList.add('full');fit()};document.querySelector('#return').onclick=()=>{document.body.classList.remove('full');fit()};window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('full');fit()}});window.addEventListener('resize',fit);im.onload=fit;fit();</script></body></html>
