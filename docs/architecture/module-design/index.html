<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>眼镜、手机与远端：关系说明</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f3f4;color:#294b59;font:16px/1.6 "Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;padding:14px 22px;border-bottom:1px solid #d8e3e7}header strong{font-size:20px;margin-right:auto}a{color:#426d82;text-decoration:none}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 22px}button{font:inherit;border:1px solid #c4d6d0;border-radius:8px;background:#fff;color:#376251;padding:8px 16px;cursor:pointer}button.active{background:#276e57;color:#fff;border-color:#276e57}nav .tools{margin-left:auto;display:flex;gap:7px}.tools button{padding:6px 10px}#frame{height:calc(100vh - 135px);overflow:auto;padding:12px 22px 22px;scrollbar-gutter:stable}#figure{display:block;background:#fff;max-width:none;margin:auto;box-shadow:0 3px 24px #243d4b12}#help{padding:12px 24px;background:#fff;color:#6d818b;font-size:14px}body.full header,body.full nav{display:none}body.full #frame{height:100vh;padding:10px}#exit{display:none;position:fixed;right:12px;top:10px;z-index:10}body.full #exit{display:block}@media(max-width:700px){header{padding:10px 12px}header strong{font-size:17px;width:100%}nav{padding:10px;gap:6px}nav button{font-size:13px;padding:6px 9px}nav .tools{margin-left:0}#frame{height:calc(100vh - 190px);padding:8px}#help{padding:10px;font-size:13px}}@media print{header,nav,#help{display:none}#frame{height:auto;overflow:visible;padding:0}#figure{width:100%!important;box-shadow:none}@page{size:A3 landscape;margin:8mm}}</style></head><body><header><strong>先看关系，再看技术细节</strong><a href="layered-view.html">分层技术图 ↗</a><a href="technical-detail.html">模块与时序细节 ↗</a><a id="download" href="diagrams/plain-overview.png" download>下载当前图 PNG</a></header><nav aria-label="选择要理解的过程"><button class="active" data-mode="overview">先看整体分工</button><button data-mode="record">① 平时怎样记下来</button><button data-mode="ask">② 提问后怎样回答</button><button data-mode="photo">③ 为什么拍照不用等远端</button><div class="tools"><button id="fit">适合窗口</button><button id="large">放大阅读</button><button id="full">全屏</button></div></nav><div id="frame"><img id="figure" src="diagrams/plain-overview.svg" alt="眼镜、手机和远端的分工关系"></div><div id="help">点上方例子，一次只看一个过程。技术名词与模块编号放在“分层技术图”里；本页的角色位置始终不变。</div><button id="exit">退出全屏</button><script>const frame=document.querySelector('#frame'),pic=document.querySelector('#figure');function fit(){pic.style.width=Math.min(frame.clientWidth-44,(frame.clientHeight-30)*1.6)+'px'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const mode=b.dataset.mode;pic.src='diagrams/plain-'+mode+'.svg';pic.alt=b.textContent;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#download').href='diagrams/plain-'+mode+'.png';frame.scrollTo(0,0);fit()});document.querySelector('#fit').onclick=fit;document.querySelector('#large').onclick=()=>{pic.style.width='1600px'};document.querySelector('#full').onclick=()=>{document.body.classList.add('full');fit()};document.querySelector('#exit').onclick=()=>{document.body.classList.remove('full');fit()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('full');fit()}});window.addEventListener('resize',fit);pic.onload=fit;fit();</script></body></html>
